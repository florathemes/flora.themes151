<style>
:root{--bg:#fbf4e6;--tx:#3a0f1c;--card:#fff;--ac:#7d1230;--gd:#c9a24a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif}
#ed{max-width:560px;margin:auto;padding:18px}#ed h1{margin:6px 0 0;color:var(--ac)}.sb{margin:2px 0 16px;opacity:.7;font-size:14px}
.fb{margin:14px 0}.fb label{display:block;font-weight:700;margin-bottom:5px}
.fb input,.fb textarea{width:100%;border:2px solid var(--gd);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);font:16px Cairo;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{border:2px solid var(--gd);background:var(--card);color:var(--tx);border-radius:20px;padding:4px 16px;font:700 14px Cairo;cursor:pointer;margin-inline-end:6px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.thm{display:flex;gap:6px;flex-wrap:wrap}.thm div{position:relative;width:64px;height:64px}.thm img{width:100%;height:100%;object-fit:cover;border-radius:8px}.thm b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:12px;cursor:pointer}
.mr{display:grid;grid-template-columns:140px 1fr 34px;gap:6px}.mr button{border:0;background:none;color:var(--ac);font-size:18px;cursor:pointer}
.bar{display:flex;gap:10px;margin:22px 0 8px}.bar button{flex:1;padding:12px;border-radius:14px;font:700 17px Cairo;cursor:pointer;border:2px solid var(--ac)}.b1{background:var(--ac);color:#fff}.b2{background:none;color:var(--ac)}
#th{position:fixed;inset:0;z-index:20;background:radial-gradient(#5b1228,#1c040c 85%);color:#f1dca0}
.st{position:relative;max-width:430px;height:100%;margin:auto;overflow:hidden}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:12px;z-index:30;background:#0006;color:#f1dca0;border:1px solid #d9b95f66;border-radius:50%;width:36px;height:36px;cursor:pointer}
.scr{position:absolute;inset:0;padding:calc(40px + env(safe-area-inset-top,0px)) 22px 80px;text-align:center;animation:fi .8s}.c{display:flex;flex-direction:column;align-items:center;justify-content:center}.sv{overflow-y:auto}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.sc{font:400 34px 'Aref Ruqaa',serif;margin-bottom:14px}#th[lang=en] .sc{font:italic 500 38px 'Cormorant Garamond',serif}.sc.dk{color:#6b3b20;font-size:28px}.big{font-size:40px}
.seal{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6de94,#b3862b);display:grid;place-items:center;color:#6e1428;font:700 15px Cairo;box-shadow:0 4px 10px #0008,inset 0 0 0 3px #d9b95f55;margin:auto}
.seal i{font-style:normal;font-size:11px;margin:0 2px}.seal.sm{width:26px;height:26px;font-size:12px}.seal.pl{animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 12px #f6de9433}}
.ev{position:relative;width:270px;height:176px;margin:12px 0 30px}.ev>*{position:absolute}
.bk{inset:0;background:#58091f;border-radius:8px;box-shadow:0 18px 34px #000b}.bk:after{content:"";position:absolute;inset:8px;border:1px solid #d9b95f66;border-radius:5px}
.lt{left:8%;right:8%;top:8%;height:80%;background:#f4e8cc;border-radius:4px;transition:transform 1.1s .6s}
.ft{inset:0;background:linear-gradient(#722038,#5e0d24);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:8px}
.fl{left:0;right:0;top:0;height:64%;background:linear-gradient(#8a1a3a,#751432);border-radius:8px 8px 50% 50%/8px 8px 100% 100%;transform-origin:top;transition:transform .9s;z-index:3;box-shadow:0 4px 8px #0006}
.ev .seal{left:50%;top:58%;margin:-31px;z-index:4;transition:opacity .4s;cursor:pointer}
.ev.op .fl{transform:rotateX(180deg);z-index:0}.ev.op .lt{transform:translateY(-62%)}.ev.op .seal{opacity:0;pointer-events:none}
.sw{display:flex;gap:8px;width:84%;border-bottom:1px solid #d9b95f88;transition:opacity .5s}.sw input{flex:1;background:none;border:0;color:#f1dca0;font:italic 17px Cairo;text-align:center;outline:0;padding:8px}
.sw input::placeholder{color:#f1dca066}.sw button,.gb{background:none;border:1px solid #d9b95f;color:#f1dca0;border-radius:30px;font:700 15px Cairo;padding:6px 18px;cursor:pointer}
.bad{animation:sk .4s}@keyframes sk{30%{transform:translateX(-8px)}70%{transform:translateX(8px)}}
.ppr{background:#f4e8cc;color:#5a3a22;box-shadow:inset 0 0 0 7px #f4e8cc,inset 0 0 0 8px #c9a24a;border-radius:10px;padding:30px 22px;width:100%;max-height:62vh;overflow:auto;margin-bottom:20px}
.tx{white-space:pre-wrap;line-height:1.9;font-size:16px}small{display:block;opacity:.7;font-size:12px;margin:4px}

.nt{background:#f4e8cc;color:#5a3a22;padding:10px 14px;border-radius:4px;transform:rotate(-1deg)}
.mbt{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;width:44px;height:44px;border-radius:50%;border:1px solid #d9b95f77;background:#2a0a13cc;color:#f1dca0;display:grid;place-items:center;cursor:pointer;z-index:6}

#th .sec.in .ti{animation:tiz .8s both}#th .sec.in .ti:nth-child(2){animation-delay:.25s}#th .sec.in .ti:nth-child(3){animation-delay:.5s}#th .sec.in .ti:nth-child(4){animation-delay:.75s}@keyframes tiz{from{opacity:0;transform:translateY(24px)}}
